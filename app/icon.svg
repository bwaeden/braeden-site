<!-- app/icon.svg
     Source: CONTEXT.md D-04, D-05; nextjs.org/docs/app/api-reference/file-conventions/metadata/app-icons
     Direction: text-on-charcoal (light B on dark bg) per RESEARCH.md A1 default.
     If real-device 16px legibility is poor in Phase 2 testing, swap fill/background.

     Path provenance (W3-T1):
       Traced from Google Fonts Fraunces v38 weight 900 ("Black") via opentype.js.
       Glyph "B" scaled+translated to fit 64x64 viewBox with ~6px padding.
       SOFT axis NOT applied — Open Question #2 verdict (STATE.md) records that
       next/font/google rejects axes alongside explicit weights, so per
       RESEARCH.md A3 we use the static Fraunces Black source instead. Phase 6
       designer-pass (D-01) replaces this with the final designed monogram.

     Single source (D-04): the <path d="..."> below is byte-identical to the
     <path> in components/ui/MonogramMark.tsx. The favicon adds rendering
     hints only (rect background, shape-rendering="crispEdges", explicit fill). -->
